<template>
    <lightning-card title="Account - Identity">
        <div class="slds-p-around_medium">
            <lightning-input
                label="Account Name"
                name="Name"
                value={nameValue}
                onchange={handleChange}
                required>
            </lightning-input>

            <lightning-input
                label="Salutation"
                name="Salutation"
                value={salutationValue}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                label="First Name"
                name="FirstName"
                value={firstNameValue}
                onchange={handleChange}>
            </lightning-input>

            <lightning-input
                label="Last Name"
                name="LastName"
                value={lastNameValue}
                onchange={handleChange}>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Save"
                    onclick={handleSave}
                    disabled={isSaving}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
