<template>
    <lightning-card title="Inspector Notes">
        <div class="slds-p-around_medium">

            <!-- Inspector Notes -->
            <lightning-textarea
                name="Inspector_Notes__c"
                label="Inspector Notes"
                value={form.Inspector_Notes__c}
                onchange={handleChange}>
            </lightning-textarea>

            <!-- SI Structural Folder (read-only) -->
            <template if:true={form.SI_Structural_Folder__c}>
                <div class="slds-m-top_large">
                    <div class="slds-text-title_caps slds-text-body_small">
                        SI - Structural Folder
                    </div>
                    <a href={form.SI_Structural_Folder__c}
                       target="_blank"
                       rel="noopener noreferrer">
                        {form.SI_Structural_Folder__c}
                    </a>
                </div>
            </template>

            <!-- Buttons -->
            <div class="slds-m-top_large slds-text-align_right">
                <lightning-button
                    variant="neutral"
                    label="Cancel"
                    onclick={handleCancel}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    variant="brand"
                    label="Save"
                    onclick={handleSave}
                    disabled={isSaving}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
