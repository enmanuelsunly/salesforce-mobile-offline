<template>
  <div class="slds-p-around_medium">
    <h1 class="slds-text-heading_medium slds-text-align_center slds-m-bottom_large">
      Referral
    </h1>

    <template if:true={hasData}>
      <div class="slds-grid slds-wrap slds-gutters">

        <!-- Left -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <lightning-input
            label="Name"
            value={oppNameValue}
            onchange={handleInputChange}
            data-field="Name">
          </lightning-input>

          <lightning-combobox
            class="slds-m-top_medium"
            label="Stage Name"
            value={stageValue}
            options={stageOptions}
            onchange={handlePicklistChange}
            data-field="StageName">
          </lightning-combobox>

          <lightning-input
            class="slds-m-top_medium"
            type="date"
            label="Close Date"
            value={closeDateValue}
            onchange={handleInputChange}
            data-field="CloseDate">
          </lightning-input>
        </div>

        <!-- Right -->
        <div class="slds-col slds-size_1-of-1 slds-large-size_1-of-2">
          <lightning-input
            label="Referred By"
            value={referredByName}
            disabled>
          </lightning-input>

          <lightning-combobox
            class="slds-m-top_medium"
            label="Referral Type"
            value={referralTypeValue}
            options={referralTypeOptions}
            onchange={handlePicklistChange}
            data-field="Referral_Type__c">
          </lightning-combobox>
        </div>

      </div>

      <template if:true={errorMessage}>
        <div class="slds-text-color_error slds-m-top_medium">{errorMessage}</div>
      </template>

      <div class="slds-grid slds-grid_align-end slds-m-top_large">
        <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
        <lightning-button
          class="slds-m-left_small"
          variant="brand"
          label="Next"
          onclick={handleSave}
          disabled={isSaving}>
        </lightning-button>
      </div>
    </template>

    <template if:false={hasData}>
      <div class="slds-text-color_weak">Loading...</div>
    </template>
  </div>
</template>
